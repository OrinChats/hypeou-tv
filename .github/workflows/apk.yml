name: Gerar APK (Android)

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Instalar dependências
        run: npm install
      - name: Criar projeto Android
        run: npx cap add android
      - name: Ajustar (TV, ícone, tela cheia)
        run: bash scripts/patch-android.sh
      - name: Sincronizar
        run: npx cap sync android
      - name: Compilar APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Renomear
        run: cp android/app/build/outputs/apk/debug/app-debug.apk HypeouTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HypeouTV-apk
          path: android-app/HypeouTV.apk
